<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#faf8f3;display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:24px;font-family:Helvetica,Arial,sans-serif}
.cell{background:#fff;border:1px solid #e3ddd0;border-radius:8px;padding:20px;text-align:center}
.cell img{width:100%;height:auto;display:block}
.label{font-size:12px;color:#5a6a5e;letter-spacing:2px;margin-top:10px;text-transform:uppercase}
.dark-cell{background:#0f2818}.dark-cell .label{color:#c4a04a}
</style></head><body>
<div class="cell"><img src="zafra-seal.svg"><div class="label">Seal · 480</div></div>
<div class="cell"><img src="zafra-lockup.svg"><div class="label">Lockup</div></div>
<div class="cell"><img src="zafra-wordmark.svg"><div class="label">Wordmark</div></div>
<div class="cell"><img src="zafra-mark.svg"><div class="label">Compact Mark</div></div>
</body></html>
