<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#faf8f3;display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:18px;font-family:Helvetica,Arial,sans-serif}
.cell{background:#fff;border:1px solid #e3ddd0;border-radius:8px;padding:14px;text-align:center}
.cell img{width:100%;height:auto;display:block}
.label{font-size:11px;color:#5a6a5e;letter-spacing:2px;margin-top:8px;text-transform:uppercase}
.wide{grid-column:span 2}
</style></head><body>
<div class="cell"><img src="pack-coffee-medium.svg"><div class="label">Café · Medium 12oz</div></div>
<div class="cell"><img src="pack-coffee-yauco.svg"><div class="label">Café · Yauco SO 12oz</div></div>
<div class="cell"><img src="pack-coffee-green.svg"><div class="label">Green Coffee · Kraft 1lb</div></div>
<div class="cell"><img src="pack-cacao-nibs.svg"><div class="label">Cacao Nibs 8oz</div></div>
<div class="cell"><img src="pack-honey.svg"><div class="label">Honey Hex Jar 8oz</div></div>
<div class="cell"><img src="pack-vanilla.svg"><div class="label">Vanilla Tube · 3 Beans</div></div>
<div class="cell wide"><img src="pack-chocolate.svg"><div class="label">Chocolate Bar 70%</div></div>
<div class="cell wide"><img src="pack-giftbox.svg"><div class="label">PR Terroir Gift Box</div></div>
<div class="cell wide"><img src="pack-provenance.svg"><div class="label">Provenance Card</div></div>
</body></html>
